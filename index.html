<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Classroom - Home</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1520'/%3E%3Cpath d='M32 12 L54 28 L48 28 L48 50 L16 50 L16 28 L10 28 Z' fill='%235cb6ff'/%3E%3Crect x='27' y='36' width='10' height='14' fill='%230d1520'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070b;
    font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
    color:#cfe3ff;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  canvas{display:block}
  .hidden{display:none!important}

  /* ============ GAME SURFACES ============ */
  #game2d{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  #stage3d{position:fixed;inset:0;touch-action:none}
  #stage3d canvas{width:100%!important;height:100%!important;display:block}

  /* ============ MENU ============ */
  #menu{
    position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;padding:26px;
    background:
      radial-gradient(circle at 50% 12%, rgba(56,120,200,.28), transparent 62%),
      radial-gradient(circle at 12% 92%, rgba(200,60,70,.16), transparent 58%),
      radial-gradient(circle at 88% 88%, rgba(60,180,255,.13), transparent 55%),
      linear-gradient(180deg,#080d16,#04060a 65%,#070b12);
    overflow-y:auto;
  }
  #menu::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(90,150,220,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(90,150,220,.055) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 20%,transparent 78%);
  }
  .brand{position:relative;text-align:center;z-index:1}
  .logo{width:96px;height:96px;margin:0 auto 16px;filter:drop-shadow(0 0 26px rgba(58,155,255,.55))}
  .logo svg{width:100%;height:100%;display:block}
  .brand h1{
    font-size:clamp(30px,6.4vw,58px);font-weight:900;letter-spacing:.5px;
    color:#f0f7ff;text-shadow:0 0 34px rgba(58,155,255,.42);line-height:1.05;
  }
  .brand h1 em{font-style:normal;color:#3a9bff}
  .tag{margin-top:10px;font-size:11.5px;letter-spacing:.42em;text-transform:uppercase;color:#6d8fb2}

  .modes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;
    max-width:820px;width:100%;position:relative;z-index:1}
  .mode{
    flex:1 1 300px;max-width:390px;cursor:pointer;text-align:left;
    padding:26px 24px 24px;border-radius:18px;border:1px solid rgba(90,150,215,.24);
    background:linear-gradient(165deg,rgba(22,38,60,.92),rgba(10,17,28,.94));
    color:#cfe3ff;font-family:inherit;transition:.18s ease;position:relative;overflow:hidden;
  }
  .mode::after{
    content:'';position:absolute;inset:0;border-radius:18px;pointer-events:none;
    box-shadow:inset 0 1px 0 rgba(150,205,255,.12);
  }
  .mode:hover,.mode:focus-visible{
    transform:translateY(-4px);border-color:rgba(92,182,255,.65);
    box-shadow:0 16px 40px -14px rgba(58,155,255,.55),0 0 0 1px rgba(92,182,255,.25);
    outline:none;
  }
  .mode[data-mode="3d"]:hover{
    border-color:rgba(255,130,110,.65);
    box-shadow:0 16px 40px -14px rgba(255,110,90,.5),0 0 0 1px rgba(255,140,120,.25);
  }
  .mIcon{font-size:34px;line-height:1;margin-bottom:14px;display:block}
  .mode h2{font-size:20px;font-weight:800;letter-spacing:.06em;color:#eaf4ff;margin-bottom:8px}
  .mode p{font-size:13.5px;line-height:1.55;color:#8caac8}
  .mode .pill{
    position:absolute;top:20px;right:20px;font-size:9.5px;letter-spacing:.16em;
    padding:4px 9px;border-radius:99px;background:rgba(58,155,255,.16);
    border:1px solid rgba(92,182,255,.35);color:#8fc6ff;font-weight:700;
  }
  .mode[data-mode="3d"] .pill{background:rgba(255,90,90,.14);border-color:rgba(255,120,120,.35);color:#ff9c9c}

  .foot{font-size:11.5px;letter-spacing:.12em;color:#4e6a86;text-align:center;position:relative;z-index:1}

  /* ============ BACK BUTTON ============ */
  #backBtn{
    position:fixed;top:16px;left:16px;z-index:40;
    padding:9px 16px;border-radius:9px;cursor:pointer;font-family:inherit;
    font-size:11px;font-weight:800;letter-spacing:.16em;
    color:#bcd8f5;background:rgba(12,22,36,.82);
    border:1px solid rgba(90,150,215,.34);backdrop-filter:blur(8px);
    transition:.15s;
  }
  #backBtn:hover{background:rgba(24,44,70,.95);border-color:rgba(92,182,255,.7);color:#eaf4ff}

  /* ============ TOUCH CONTROLS ============ */
  #touch{position:fixed;inset:0;z-index:30;pointer-events:none}
  #joyBase{
    position:absolute;left:26px;bottom:26px;width:132px;height:132px;
    border-radius:50%;pointer-events:auto;touch-action:none;
    background:radial-gradient(circle,rgba(20,36,58,.6),rgba(10,18,30,.34));
    border:2px solid rgba(92,182,255,.26);
    box-shadow:inset 0 0 30px rgba(58,155,255,.12);
  }
  #joyKnob{
    position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 36% 32%,#8ed4ff,#2a86e0 62%,#17527f);
    box-shadow:0 0 22px rgba(58,155,255,.6),inset 0 -3px 8px rgba(0,0,0,.35);
    transition:transform .04s linear;
  }
  #fireBtn{
    position:absolute;right:30px;bottom:34px;width:104px;height:104px;border-radius:50%;
    pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;letter-spacing:.14em;color:#fff;
    background:radial-gradient(circle at 38% 32%,#ff8a70,#e03535 60%,#8e1414);
    border:2px solid rgba(255,150,130,.5);
    box-shadow:0 0 30px rgba(255,70,60,.45),inset 0 -4px 12px rgba(0,0,0,.4);
    transition:transform .07s;
  }
  #fireBtn.on{transform:scale(.9);box-shadow:0 0 46px rgba(255,90,60,.9),inset 0 -2px 8px rgba(0,0,0,.5)}

  /* ============ 3D HUD ============ */
  #hud3d{position:fixed;inset:0;z-index:20;pointer-events:none}
  #crosshair{
    position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  }
  #crosshair::before,#crosshair::after{
    content:'';position:absolute;background:rgba(230,245,255,.85);
    box-shadow:0 0 4px rgba(0,0,0,.9);
  }
  #crosshair::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
  #crosshair::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
  #hitmark{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.9);
    font-size:26px;color:#ffd76a;opacity:0;font-weight:900;transition:opacity .1s;
    text-shadow:0 0 12px rgba(255,200,80,.9);
  }
  #hitmark.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  #obj3d{
    position:absolute;top:20px;left:50%;transform:translateX(-50%);
    padding:9px 20px;border-radius:9px;background:rgba(8,14,24,.72);
    border:1px solid rgba(90,150,215,.28);backdrop-filter:blur(8px);
    font-size:11.5px;font-weight:700;letter-spacing:.15em;color:#a8c8e8;white-space:nowrap;
  }
  #obj3d b{color:#ffd76a}

  #hudBottom3d{
    position:absolute;left:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;
  }
  #hpWrap{
    width:min(250px,44vw);height:15px;border-radius:5px;overflow:hidden;
    background:rgba(6,12,20,.8);border:1px solid rgba(90,150,215,.3);
  }
  #hpBar{height:100%;width:100%;border-radius:4px;transition:width .16s;
    background:linear-gradient(90deg,#22c55e,#4ade80)}
  #ammo3d{
    font-size:26px;font-weight:900;letter-spacing:.06em;color:#eaf4ff;
    text-shadow:0 2px 10px rgba(0,0,0,.9);
  }
  #ammo3d small{font-size:13px;color:#7fa3c9;font-weight:700}
  #reload3d{
    font-size:11px;letter-spacing:.2em;color:#ffb347;font-weight:800;opacity:0;
    transition:opacity .15s;
  }
  #reload3d.show{opacity:1}

  #vignette{
    position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .18s;
    background:radial-gradient(circle,transparent 42%,rgba(180,20,20,.62) 100%);
  }

  /* ============ END SCREEN ============ */
  #end3d{
    position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(30,10,10,.82),rgba(3,4,7,.96));
    backdrop-filter:blur(4px);padding:20px;
  }
  #end3d .panel{text-align:center;max-width:520px}
  #endTitle{font-size:clamp(38px,8vw,72px);font-weight:900;letter-spacing:.04em;color:#ff6b6b;
    text-shadow:0 0 44px rgba(255,80,80,.6);margin-bottom:10px}
  #endTitle.win{color:#7cf7a0;text-shadow:0 0 44px rgba(80,255,150,.6)}
  #endSub{color:#9dbbd8;font-size:14px;letter-spacing:.06em;margin-bottom:32px;line-height:1.6}
  #endBtn{
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.2em;padding:14px 46px;
    border-radius:10px;cursor:pointer;color:#04101f;border:none;
    background:linear-gradient(180deg,#5cb6ff,#2a86e0);
    box-shadow:0 5px 0 #12508c,0 0 40px rgba(58,155,255,.4);transition:.1s;
  }
  #endBtn:hover{transform:translateY(-1px);box-shadow:0 6px 0 #12508c,0 0 55px rgba(58,155,255,.65)}
  #endBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #12508c}
  #endMenu{
    display:block;margin:18px auto 0;background:none;border:none;cursor:pointer;
    font-family:inherit;font-size:11px;letter-spacing:.2em;font-weight:700;color:#63809c;
    padding:8px 16px;
  }
  #endMenu:hover{color:#bcd8f5}

  @media (max-width:640px){
    #joyBase{width:118px;height:118px;left:18px;bottom:22px}
    #joyKnob{width:52px;height:52px;margin:-26px 0 0 -26px}
    #fireBtn{width:92px;height:92px;right:22px;bottom:28px}
    .modes{gap:14px}
    .mode{padding:22px 20px}
  }
</style>
</head>
<body>

<canvas id="game2d" class="hidden"></canvas>
<div id="stage3d" class="hidden"></div>

<!-- 3D HUD -->
<div id="hud3d" class="hidden">
  <div id="crosshair"></div>
  <div id="hitmark">✕</div>
  <div id="obj3d">DEFENDERS REMAINING <b id="objCount">10</b></div>
  <div id="hudBottom3d">
    <div id="hpWrap"><div id="hpBar"></div></div>
    <div id="ammo3d"><span id="ammoNum">8</span><small> / 8</small></div>
    <div id="reload3d">RELOADING…</div>
  </div>
  <div id="vignette"></div>
</div>

<!-- Touch controls -->
<div id="touch" class="hidden">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="fireBtn">FIRE</div>
</div>

<button id="backBtn" class="hidden">‹ MENU</button>

<!-- End screen (3D) -->
<div id="end3d" class="hidden">
  <div class="panel">
    <h1 id="endTitle">K.I.A.</h1>
    <p id="endSub">You fell on the beach.</p>
    <button id="endBtn">REDEPLOY</button>
    <button id="endMenu">MAIN MENU</button>
  </div>
</div>

<!-- Main menu -->
<div id="menu">
  <div class="brand">
    <div class="logo" id="logoHolder"></div>
    <h1>Classroom <em>–</em> Home</h1>
    <p class="tag">Choose your deployment</p>
  </div>

  <div class="modes">
    <button class="mode" data-mode="2d">
      <span class="pill">TOUCH</span>
      <span class="mIcon">🕹️</span>
      <h2>Mobile Mode</h2>
      <p>Top-down territory war. Push the front line, paint the map, outgun the enemy armour. Joystick + fire button.</p>
    </button>

    <button class="mode" data-mode="3d">
      <span class="pill">3D</span>
      <span class="mIcon">🪖</span>
      <h2>Soldier Mode</h2>
      <p>D-Day, Omaha Beach. Ride the Higgins boat in, hit the sand, and clear the bluff in a first-person 3D simulation.</p>
    </button>
  </div>

  <div class="foot">WASD / joystick to move · mouse / drag to look · click / FIRE to shoot</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════
   SHARED
   ══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);

const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ed4ff"/><stop offset="1" stop-color="#1f6fd0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b1420"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="#5cb6ff" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M32 11 L55 27.5 L48.5 27.5 L48.5 51 L15.5 51 L15.5 27.5 L9 27.5 Z" fill="url(#lg)"/>
  <rect x="27" y="36" width="10" height="15" rx="1.5" fill="#0b1420"/>
  <circle cx="32" cy="26.5" r="3.4" fill="#0b1420"/>
</svg>`;

$('#logoHolder').innerHTML = LOGO;
$('#favicon').href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO);

/* ---------- audio ---------- */
let actx = null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
}
function blip(freq, dur, type='square', vol=0.04, slideTo=null){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}

/* ---------- mode routing ---------- */
let mode = null;
const menuEl  = $('#menu');
const touchEl = $('#touch');
const backBtn = $('#backBtn');
const hud3d   = $('#hud3d');
const stage3d = $('#stage3d');
const cv2     = $('#game2d');
const endEl   = $('#end3d');

document.querySelectorAll('.mode').forEach(b=>{
  b.addEventListener('click', ()=> startMode(b.dataset.mode));
});
backBtn.addEventListener('click', exitToMenu);
$('#endMenu').addEventListener('click', exitToMenu);

function exitToMenu(){
  initAudio();
  if(document.pointerLockElement) document.exitPointerLock();
  mode = null;
  menuEl.classList.remove('hidden');
  cv2.classList.add('hidden');
  stage3d.classList.add('hidden');
  hud3d.classList.add('hidden');
  touchEl.classList.add('hidden');
  backBtn.classList.add('hidden');
  endEl.classList.add('hidden');
  G2.running = false;
  if(T) T.active = false;
  resetJoy();
}

function startMode(m){
  initAudio();
  mode = m;
  menuEl.classList.add('hidden');
  backBtn.classList.remove('hidden');
  endEl.classList.add('hidden');
  resetJoy();

  if(m === '2d'){
    stage3d.classList.add('hidden');
    hud3d.classList.add('hidden');
    cv2.classList.remove('hidden');
    touchEl.classList.remove('hidden');
    start2D();
  } else {
    cv2.classList.add('hidden');
    touchEl.classList.toggle('hidden', !isTouch);
    start3D();
  }
  last = performance.now();
}

/* ══════════════════════════════════════════════════════════
   TOUCH CONTROLS (shared)
   ══════════════════════════════════════════════════════════ */
const joyBase = $('#joyBase');
const joyKnob = $('#joyKnob');
const fireBtn = $('#fireBtn');

const joy = { active:false, id:null, x:0, y:0, cx:0, cy:0 };
const fire = { held:false };

function resetJoy(){
  joy.active = false; joy.id = null; joy.x = 0; joy.y = 0;
  joyKnob.style.transform = 'translate(0px,0px)';
  fire.held = false;
  fireBtn.classList.remove('on');
}

function moveJoy(px, py){
  let dx = px - joy.cx, dy = py - joy.cy;
  const d = Math.hypot(dx, dy), max = 52;
  if(d > max){ dx = dx/d*max; dy = dy/d*max; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
  joy.x = dx/max; joy.y = dy/max;
}

joyBase.addEventListener('pointerdown', e=>{
  e.preventDefault(); initAudio();
  joyBase.setPointerCapture(e.pointerId);
  const r = joyBase.getBoundingClientRect();
  joy.cx = r.left + r.width/2;
  joy.cy = r.top + r.height/2;
  joy.active = true; joy.id = e.pointerId;
  moveJoy(e.clientX, e.clientY);
});
joyBase.addEventListener('pointermove', e=>{
  if(joy.active && e.pointerId === joy.id) moveJoy(e.clientX, e.clientY);
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
  joyBase.addEventListener(ev, e=>{ if(joy.active && e.pointerId === joy.id) resetJoy(); });
});

fireBtn.addEventListener('pointerdown', e=>{
  e.preventDefault(); initAudio();
  fireBtn.setPointerCapture(e.pointerId);
  fire.held = true; fireBtn.classList.add('on');
  if(T) T.wantFire = true;
});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
  fireBtn.addEventListener(ev, ()=>{ fire.held = false; fireBtn.classList.remove('on'); });
});

/* ══════════════════════════════════════════════════════════
   ██  2D — MOBILE MODE
   ══════════════════════════════════════════════════════════ */
const cx2 = cv2.getContext('2d');
let W2 = 0, H2 = 0;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize2D(){
  W2 = window.innerWidth; H2 = window.innerHeight;
  cv2.width  = Math.floor(W2*DPR);
  cv2.height = Math.floor(H2*DPR);
  cv2.style.width  = W2+'px';
  cv2.style.height = H2+'px';
  cx2.setTransform(DPR,0,0,DPR,0,0);
}

const TILE = 40, COLS = 48, ROWS = 32;
const WORLD_W = COLS*TILE, WORLD_H = ROWS*TILE;
const BLUE = 1, RED = 2;
const BLUE_BASE = { x:200, y:WORLD_H/2 };
const RED_BASE  = { x:WORLD_W-200, y:WORLD_H/2 };
const CAP_RATE = 0.9, OWN_T = 0.3, WIN_PCT = 0.55;
const COL_B = ['#0d2a44','#123c61','#174f80','#1d639f','#2478be','#3a9bff'];
const COL_R = ['#44121a','#611a22','#7f232b','#9d2c34','#bb353d','#ff4d55'];

const keys = Object.create(null);
window.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.code] = false; });

const mouse2 = { x:0, y:0, down:false, lastMove:0 };
cv2.addEventListener('mousemove', e=>{
  if(mode!=='2d') return;
  mouse2.x = e.clientX; mouse2.y = e.clientY;
  mouse2.lastMove = performance.now();
});
cv2.addEventListener('mousedown', e=>{ if(mode==='2d' && e.button===0){ initAudio(); mouse2.down = true; }});
window.addEventListener('mouseup', e=>{ if(e.button===0) mouse2.down = false; });
cv2.addEventListener('contextmenu', e=>e.preventDefault());

const terr = new Float32Array(COLS*ROWS);

const G2 = {
  running:false, time:0, units:[], bullets:[], particles:[],
  player:null, cam:{x:WORLD_W/2, y:WORLD_H/2},
  shake:0, kills:0, score:0,
  redCd:1, blueCd:1, bluePct:0, redPct:0, pctT:0, redTarget:4,
};
let uid2 = 0;

/* --- territory --- */
function initTerritory(){
  terr.fill(0);
  for(let cy=0; cy<ROWS; cy++){
    for(let cx=0; cx<COLS; cx++){
      const wx = cx*TILE+TILE/2, wy = cy*TILE+TILE/2;
      const db = Math.hypot(wx-BLUE_BASE.x, wy-BLUE_BASE.y);
      const dr = Math.hypot(wx-RED_BASE.x,  wy-RED_BASE.y);
      const i = cy*COLS+cx;
      if(db < 420) terr[i] =  Math.min(1,(420-db)/260);
      if(dr < 420) terr[i] = -Math.min(1,(420-dr)/260);
    }
  }
}

/* --- units --- */
function makeUnit(x,y,team,isPlayer){
  const c = isPlayer
    ? { hp:150, speed:255, fireRate:0.15, dmg:15, bs:980,  r:17, capR:175 }
    : { hp:62,  speed:150, fireRate:0.72, dmg:8,  bs:640,  r:15, capR:125 };
  return {
    id:++uid2, x, y, vx:0, vy:0,
    ang: isPlayer?0:Math.PI,
    team, isPlayer,
    hp:c.hp, maxHp:c.hp, r:c.r, speed:c.speed,
    fireRate:c.fireRate, dmg:c.dmg, bulletSpeed:c.bs, capR:c.capR,
    cool:0, alive:true, respawn:0, hitFlash:0, recoil:0,
    strafe: Math.random()<0.5?1:-1, strafeT:0, wobble:Math.random()*6.28,
  };
}

function spawnBot(team){
  const base = team===BLUE ? BLUE_BASE : RED_BASE;
  let x = base.x + (Math.random()-0.5)*120;
  let y = base.y + (Math.random()-0.5)*520;
  x = Math.max(40, Math.min(WORLD_W-40, x));
  y = Math.max(40, Math.min(WORLD_H-40, y));
  const u = makeUnit(x,y,team,false);
  G2.units.push(u);
}

function burst2(x,y,n,color,speed,life,size){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, s = speed*(0.25+Math.random()*0.9);
    G2.particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life: life*(0.6+Math.random()*0.7), maxLife: life,
      color, size: size*(0.5+Math.random()*0.9),
    });
  }
}

function fire2(u, angle){
  const spread = u.isPlayer ? 0.03 : 0.075;
  const a = angle + (Math.random()-0.5)*spread;
  const m = u.r + 10;
  const bx = u.x + Math.cos(a)*m, by = u.y + Math.sin(a)*m;
  G2.bullets.push({
    x:bx, y:by, px:bx, py:by,
    vx:Math.cos(a)*u.bulletSpeed, vy:Math.sin(a)*u.bulletSpeed,
    team:u.team, dmg:u.dmg, life:1.5, r:4,
  });
  burst2(bx,by,4, u.team===BLUE?'#8ed4ff':'#ffb08e', 160, 0.18, 3);
  u.cool = u.fireRate; u.recoil = 1;
  if(u.isPlayer){ G2.shake = Math.min(G2.shake+2.2, 9); blip(340,0.06,'square',0.03,140); }
}

function damage2(u, amount, srcTeam){
  if(!u.alive) return;
  u.hp -= amount; u.hitFlash = 1;
  burst2(u.x,u.y,4, u.team===BLUE?'#6fc4ff':'#ff8080', 200, 0.25, 3);
  if(u.hp <= 0){
    u.alive = false; u.hp = 0;
    burst2(u.x,u.y,26, u.team===BLUE?'#5cb6ff':'#ff5a5a', 420, 0.7, 5);
    burst2(u.x,u.y,12,'#ffd76a',300,0.5,3);
    G2.shake = Math.min(G2.shake+9, 22);
    blip(160,0.28,'sawtooth',0.05,40);
    if(u.isPlayer){ u.respawn = 3.0; G2.shake = 26; }
    else if(srcTeam === BLUE){ G2.kills++; G2.score += 100; }
  }
}

function clampWorld(u){
  const m = u.r+4;
  if(u.x<m){u.x=m;u.vx=0;}
  if(u.y<m){u.y=m;u.vy=0;}
  if(u.x>WORLD_W-m){u.x=WORLD_W-m;u.vx=0;}
  if(u.y>WORLD_H-m){u.y=WORLD_H-m;u.vy=0;}
}

function angleDiff(a,b){
  let d = b-a;
  while(d>Math.PI) d -= 6.283185307;
  while(d<-Math.PI) d += 6.283185307;
  return d;
}

function updateBot2(u, dt){
  let target=null, best=Infinity;
  for(const o of G2.units){
    if(!o.alive || o.team===u.team) continue;
    const dx=o.x-u.x, dy=o.y-u.y, d=dx*dx+dy*dy;
    if(d<best){ best=d; target=o; }
  }
  best = Math.sqrt(best);

  let mx=0, my=0;
  if(target && best < 720){
    const desired = 250;
    const ang = Math.atan2(target.y-u.y, target.x-u.x);
    u.strafeT -= dt;
    if(u.strafeT <= 0){ u.strafeT = 1.2+Math.random()*1.6; u.strafe *= -1; }

    if(best > desired+70){ mx = Math.cos(ang); my = Math.sin(ang); }
    else if(best < desired-90){ mx = -Math.cos(ang); my = -Math.sin(ang); }
    else { mx = Math.cos(ang+1.5708)*u.strafe; my = Math.sin(ang+1.5708)*u.strafe; }

    const lead = best/u.bulletSpeed;
    const aim = Math.atan2(target.y+target.vy*lead-u.y, target.x+target.vx*lead-u.x);
    u.ang += angleDiff(u.ang, aim) * Math.min(1, dt*9);
    if(u.cool <= 0 && Math.abs(angleDiff(u.ang, aim)) < 0.24) fire2(u, u.ang);
  } else {
    const goal = u.team===BLUE ? RED_BASE : BLUE_BASE;
    const ang = Math.atan2(goal.y-u.y, goal.x-u.x) + Math.sin(G2.time*1.1+u.wobble)*0.35;
    mx = Math.cos(ang); my = Math.sin(ang);
    u.ang += angleDiff(u.ang, ang) * Math.min(1, dt*5);
  }

  const k = 1 - Math.exp(-9*dt);
  u.vx += (mx*u.speed - u.vx)*k;
  u.vy += (my*u.speed - u.vy)*k;
  u.x += u.vx*dt; u.y += u.vy*dt;
  clampWorld(u);
}

function updatePlayer2(u, dt){
  // movement
  let dx=0, dy=0;
  if(joy.active && (joy.x || joy.y)){ dx = joy.x; dy = joy.y; }
  else {
    if(keys.KeyD||keys.ArrowRight) dx += 1;
    if(keys.KeyA||keys.ArrowLeft)  dx -= 1;
    if(keys.KeyS||keys.ArrowDown)  dy += 1;
    if(keys.KeyW||keys.ArrowUp)    dy -= 1;
    const l = Math.hypot(dx,dy);
    if(l > 1){ dx/=l; dy/=l; }
  }

  const k = 1 - Math.exp(-14*dt);
  u.vx += (dx*u.speed - u.vx)*k;
  u.vy += (dy*u.speed - u.vy)*k;
  u.x += u.vx*dt; u.y += u.vy*dt;
  clampWorld(u);

  // aim
  let aimAng = null;
  const mouseFresh = !isTouch && (performance.now() - mouse2.lastMove < 1600);
  if(mouseFresh){
    const wmx = mouse2.x - W2/2 + G2.cam.x;
    const wmy = mouse2.y - H2/2 + G2.cam.y;
    aimAng = Math.atan2(wmy-u.y, wmx-u.x);
  } else {
    let tgt=null, bd=Infinity;
    for(const o of G2.units){
      if(!o.alive || o.team===u.team) continue;
      const d = Math.hypot(o.x-u.x, o.y-u.y);
      if(d < 720 && d < bd){ bd = d; tgt = o; }
    }
    if(tgt) aimAng = Math.atan2(tgt.y-u.y, tgt.x-u.x);
    else if(Math.hypot(dx,dy) > 0.1) aimAng = Math.atan2(dy,dx);
  }
  if(aimAng !== null) u.ang += angleDiff(u.ang, aimAng) * Math.min(1, dt*18);

  // fire
  const shooting = mouse2.down || keys.Space || fire.held;
  if(shooting && u.cool <= 0) fire2(u, u.ang);
}

function updateCapture2(dt){
  for(const u of G2.units){
    if(!u.alive) continue;
    const R = u.capR, sign = u.team===BLUE ? 1 : -1;
    const cx0 = Math.max(0, Math.floor((u.x-R)/TILE));
    const cx1 = Math.min(COLS-1, Math.floor((u.x+R)/TILE));
    const cy0 = Math.max(0, Math.floor((u.y-R)/TILE));
    const cy1 = Math.min(ROWS-1, Math.floor((u.y+R)/TILE));
    for(let cy=cy0; cy<=cy1; cy++){
      const wy = cy*TILE+TILE/2;
      for(let cx=cx0; cx<=cx1; cx++){
        const wx = cx*TILE+TILE/2;
        const ddx = wx-u.x, ddy = wy-u.y;
        const d2 = ddx*ddx + ddy*ddy;
        if(d2 > R*R) continue;
        const fall = 1 - Math.sqrt(d2)/R;
        const i = cy*COLS+cx;
        let v = terr[i] + sign*CAP_RATE*fall*dt*1.6;
        terr[i] = v > 1 ? 1 : v < -1 ? -1 : v;
      }
    }
  }
}

function updateBullets2(dt){
  for(let i=G2.bullets.length-1; i>=0; i--){
    const b = G2.bullets[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.life -= dt;
    let dead = b.life <= 0 || b.x<0 || b.y<0 || b.x>WORLD_W || b.y>WORLD_H;
    if(!dead){
      for(const u of G2.units){
        if(!u.alive || u.team===b.team) continue;
        const dx=u.x-b.x, dy=u.y-b.y;
        if(dx*dx+dy*dy < (u.r+b.r)*(u.r+b.r)){
          damage2(u, b.dmg, b.team);
          burst2(b.x,b.y,7,'#ffe08a',240,0.3,3);
          dead = true; break;
        }
      }
    }
    if(dead) G2.bullets.splice(i,1);
  }
}

function countTeam(team){
  let n=0;
  for(const u of G2.units) if(u.alive && u.team===team && !u.isPlayer) n++;
  return n;
}

function updateSpawning2(dt){
  G2.redTarget = Math.min(12, 4 + Math.floor(G2.time/30));
  G2.redCd -= dt;
  if(G2.redCd <= 0 && countTeam(RED) < G2.redTarget){ spawnBot(RED); G2.redCd = 1.4; }
  G2.blueCd -= dt;
  if(G2.blueCd <= 0 && countTeam(BLUE) < 3){ spawnBot(BLUE); G2.blueCd = 2.6; }
}

function update2D(dt){
  if(!G2.running) return;
  G2.time += dt;
  G2.shake *= Math.exp(-9*dt);

  const p = G2.player;
  if(p){
    if(p.alive) updatePlayer2(p, dt);
    else {
      p.respawn -= dt;
      if(p.respawn <= 0){
        p.alive = true; p.hp = p.maxHp;
        p.x = BLUE_BASE.x+70;
        p.y = BLUE_BASE.y + (Math.random()-0.5)*120;
        p.vx = p.vy = 0;
        burst2(p.x,p.y,18,'#6fc4ff',300,0.6,4);
      }
    }
  }

  for(let i=G2.units.length-1; i>=0; i--){
    const u = G2.units[i];
    if(u.isPlayer) continue;
    if(!u.alive){ G2.units.splice(i,1); continue; }
    updateBot2(u, dt);
  }

  for(const u of G2.units){
    if(u.cool > 0) u.cool -= dt;
    if(u.hitFlash > 0) u.hitFlash = Math.max(0, u.hitFlash - dt*5);
    if(u.recoil > 0) u.recoil = Math.max(0, u.recoil - dt*8);
  }

  updateBullets2(dt);
  updateCapture2(dt);
  updateSpawning2(dt);

  for(let i=G2.particles.length-1; i>=0; i--){
    const q = G2.particles[i];
    q.life -= dt;
    if(q.life <= 0){ G2.particles.splice(i,1); continue; }
    q.x += q.vx*dt; q.y += q.vy*dt;
    const damp = Math.pow(0.08, dt);
    q.vx *= damp; q.vy *= damp;
  }

  // camera
  if(p && p.alive){
    const k = 1 - Math.exp(-9*dt);
    G2.cam.x += (p.x-G2.cam.x)*k;
    G2.cam.y += (p.y-G2.cam.y)*k;
  }
  const hw = W2/2, hh = H2/2;
  if(WORLD_W > W2) G2.cam.x = Math.max(hw, Math.min(WORLD_W-hw, G2.cam.x));
  else G2.cam.x = WORLD_W/2;
  if(WORLD_H > H2) G2.cam.y = Math.max(hh, Math.min(WORLD_H-hh, G2.cam.y));
  else G2.cam.y = WORLD_H/2;

  // percentages
  G2.pctT -= dt;
  if(G2.pctT <= 0){
    G2.pctT = 0.25;
    let b=0, r=0;
    for(let i=0;i<terr.length;i++){
      const v = terr[i];
      if(v > OWN_T) b++; else if(v < -OWN_T) r++;
    }
    G2.bluePct = b/terr.length;
    G2.redPct  = r/terr.length;
  }
}

function roundRect(c,x,y,w,h,r){
  if(w<0){ x+=w; w=-w; }
  const rr = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+rr,y);
  c.arcTo(x+w,y,x+w,y+h,rr);
  c.arcTo(x+w,y+h,x,y+h,rr);
  c.arcTo(x,y+h,x,y,rr);
  c.arcTo(x,y,x+w,y,rr);
  c.closePath();
}

const mmCanvas = document.createElement('canvas');
const MMW = 160, MMH = Math.round(MMW*WORLD_H/WORLD_W);
mmCanvas.width = MMW; mmCanvas.height = MMH;
const mmCtx = mmCanvas.getContext('2d');
let mmT = 0;

function updateMinimap2(){
  mmCtx.clearRect(0,0,MMW,MMH);
  const cw = MMW/COLS, ch = MMH/ROWS;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const v = terr[y*COLS+x];
    const a = v<0?-v:v;
    if(a < 0.05) continue;
    mmCtx.fillStyle = v>0
      ? `rgba(58,155,255,${0.28+a*0.72})`
      : `rgba(255,77,85,${0.28+a*0.72})`;
    mmCtx.fillRect(x*cw, y*ch, cw+0.6, ch+0.6);
  }
}

function render2D(){
  if(!G2.running) return;
  cx2.fillStyle = '#070a0f';
  cx2.fillRect(0,0,W2,H2);

  const sx = (Math.random()-0.5)*G2.shake;
  const sy = (Math.random()-0.5)*G2.shake;

  cx2.save();
  cx2.translate(W2/2 - G2.cam.x + sx, H2/2 - G2.cam.y + sy);

  const left = G2.cam.x - W2/2 - 80, top = G2.cam.y - H2/2 - 80;
  const right = G2.cam.x + W2/2 + 80, bottom = G2.cam.y + H2/2 + 80;

  // ground
  cx2.fillStyle = '#0b1119';
  cx2.fillRect(left, top, right-left, bottom-top);

  const cx0 = Math.max(0, Math.floor(left/TILE)), cx1 = Math.min(COLS, Math.ceil(right/TILE));
  const cy0 = Math.max(0, Math.floor(top/TILE)),  cy1 = Math.min(ROWS, Math.ceil(bottom/TILE));

  cx2.strokeStyle = 'rgba(60,110,160,0.10)';
  cx2.lineWidth = 1;
  cx2.beginPath();
  for(let x=cx0;x<=cx1;x++){ cx2.moveTo(x*TILE, cy0*TILE); cx2.lineTo(x*TILE, cy1*TILE); }
  for(let y=cy0;y<=cy1;y++){ cx2.moveTo(cx0*TILE, y*TILE); cx2.lineTo(cx1*TILE, y*TILE); }
  cx2.stroke();

  // territory batches
  const groups = new Map();
  for(let cy=cy0; cy<cy1; cy++){
    const rowBase = cy*COLS;
    for(let cx=cx0; cx<cx1; cx++){
      const v = terr[rowBase+cx];
      const a = v<0?-v:v;
      if(a < 0.03) continue;
      let step = (a*6)|0; if(step>5) step = 5;
      const key = (v>0?'b':'r')+step;
      let arr = groups.get(key);
      if(!arr){ arr = []; groups.set(key, arr); }
      arr.push(cx*TILE, cy*TILE);
    }
  }
  for(const [key, arr] of groups){
    const step = key.charCodeAt(1)-48;
    cx2.fillStyle = key[0]==='b' ? COL_B[step] : COL_R[step];
    cx2.beginPath();
    for(let i=0;i<arr.length;i+=2) cx2.rect(arr[i], arr[i+1], TILE+0.5, TILE+0.5);
    cx2.fill();
  }

  // bases
  drawBase2(BLUE_BASE.x, BLUE_BASE.y, '#3a9bff');
  drawBase2(RED_BASE.x, RED_BASE.y, '#ff4d55');

  // particles
  for(const q of G2.particles){
    const a = Math.max(0, q.life/q.maxLife);
    cx2.globalAlpha = a;
    cx2.fillStyle = q.color;
    const s = q.size*a;
    cx2.fillRect(q.x-s/2, q.y-s/2, s, s);
  }
  cx2.globalAlpha = 1;

  // bullets
  for(const b of G2.bullets){
    cx2.strokeStyle = b.team===BLUE ? '#9fe0ff' : '#ffb3a0';
    cx2.lineWidth = 3.5;
    cx2.lineCap = 'round';
    cx2.globalAlpha = 0.85;
    cx2.beginPath();
    cx2.moveTo(b.px, b.py);
    cx2.lineTo(b.x, b.y);
    cx2.stroke();
    cx2.globalAlpha = 1;
    cx2.fillStyle = '#fff';
    cx2.beginPath(); cx2.arc(b.x, b.y, 2.4, 0, 6.2832); cx2.fill();
  }
  cx2.lineCap = 'butt';

  // units
  for(const u of G2.units){ if(u.alive) drawTank2(u); }

  cx2.restore();

  drawHUD2();
}

function drawBase2(x,y,color){
  const t = G2.time;
  cx2.save();
  cx2.translate(x,y);
  cx2.globalAlpha = 0.55 + Math.sin(t*2)*0.15;
  cx2.strokeStyle = color; cx2.lineWidth = 3;
  cx2.beginPath(); cx2.arc(0,0,62,0,6.2832); cx2.stroke();
  cx2.globalAlpha = 0.22;
  cx2.beginPath(); cx2.arc(0,0,92,0,6.2832); cx2.stroke();
  cx2.globalAlpha = 0.85;
  cx2.fillStyle = color;
  cx2.font = 'bold 13px monospace';
  cx2.textAlign = 'center';
  cx2.fillText('BASE', 0, -72);
  cx2.restore();
}

function drawTank2(u){
  const isBlue = u.team===BLUE;
  const main  = isBlue ? '#3a9bff' : '#ff4d55';
  const dark  = isBlue ? '#134a7a' : '#7a1a1a';
  const light = isBlue ? '#8ed4ff' : '#ffb0b0';

  cx2.save();
  cx2.translate(u.x, u.y);

  cx2.globalAlpha = 0.35;
  cx2.fillStyle = '#000';
  cx2.beginPath();
  cx2.ellipse(3,5,u.r*1.15,u.r*0.95,0,0,6.2832);
  cx2.fill();
  cx2.globalAlpha = 1;

  cx2.rotate(u.ang);
  const r = u.r;

  cx2.fillStyle = '#0d131b';
  cx2.fillRect(-r, -r*0.98, r*2, r*0.38);
  cx2.fillRect(-r,  r*0.60, r*2, r*0.38);
  cx2.fillStyle = '#1d2a38';
  for(let i=-3;i<=3;i++){
    cx2.fillRect(i*r*0.28-1.5, -r*0.98, 2.5, r*0.38);
    cx2.fillRect(i*r*0.28-1.5,  r*0.60, 2.5, r*0.38);
  }

  cx2.fillStyle = dark;
  cx2.fillRect(-r*0.95, -r*0.62, r*1.9, r*1.24);
  cx2.fillStyle = main;
  cx2.fillRect(-r*0.72, -r*0.48, r*1.5, r*0.96);

  const rec = u.recoil ? -3*u.recoil : 0;
  cx2.fillStyle = '#0e1720';
  cx2.fillRect(r*0.4+rec, -3.5, r*1.55, 7);
  cx2.fillStyle = main;
  cx2.fillRect(r*0.4+rec, -2, r*1.5, 4);

  cx2.fillStyle = main;
  cx2.beginPath(); cx2.arc(0,0,r*0.60,0,6.2832); cx2.fill();
  cx2.fillStyle = light;
  cx2.beginPath(); cx2.arc(-r*0.12,-r*0.12,r*0.28,0,6.2832); cx2.fill();

  if(u.hitFlash > 0){
    cx2.globalAlpha = u.hitFlash*0.75;
    cx2.fillStyle = '#fff';
    cx2.beginPath(); cx2.arc(0,0,r*1.05,0,6.2832); cx2.fill();
    cx2.globalAlpha = 1;
  }
  cx2.restore();

  if(u.isPlayer){
    cx2.save();
    cx2.translate(u.x, u.y);
    cx2.strokeStyle = 'rgba(140,215,255,0.9)';
    cx2.lineWidth = 2;
    cx2.beginPath();
    cx2.arc(0,0,u.r+10+Math.sin(G2.time*4)*2,0,6.2832);
    cx2.stroke();
    cx2.strokeStyle = 'rgba(140,215,255,0.13)';
    cx2.beginPath(); cx2.arc(0,0,u.capR,0,6.2832); cx2.stroke();
    cx2.restore();
  }

  if(u.hp < u.maxHp){
    const w = 40, h = 5, x = u.x-w/2, y = u.y-u.r-16;
    cx2.fillStyle = 'rgba(0,0,0,0.65)';
    cx2.fillRect(x-1,y-1,w+2,h+2);
    const pct = Math.max(0, u.hp/u.maxHp);
    cx2.fillStyle = pct>0.55?'#4ade80':pct>0.25?'#fbbf24':'#ef4444';
    cx2.fillRect(x,y,w*pct,h);
  }
}

function drawHUD2(){
  // territory bar
  const barW = Math.min(520, W2*0.56);
  const barH = 18;
  const barX = (W2-barW)/2, barY = 18;

  cx2.fillStyle = 'rgba(6,12,20,0.78)';
  roundRect(cx2, barX-4, barY-4, barW+8, barH+8, 8); cx2.fill();
  cx2.fillStyle = '#131b26';
  roundRect(cx2, barX, barY, barW, barH, 5); cx2.fill();

  const bp = Math.min(1, G2.bluePct/WIN_PCT);
  const rp = Math.min(1, G2.redPct/WIN_PCT);
  cx2.fillStyle = '#2b86e0'; cx2.fillRect(barX, barY, barW*bp, barH);
  cx2.fillStyle = '#d93a42'; cx2.fillRect(barX+barW-barW*rp, barY, barW*rp, barH);

  cx2.strokeStyle = 'rgba(255,255,255,0.28)';
  cx2.lineWidth = 2;
  cx2.beginPath();
  cx2.moveTo(barX+barW/2, barY-2); cx2.lineTo(barX+barW/2, barY+barH+2);
  cx2.stroke();

  cx2.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
  cx2.textAlign = 'left';  cx2.fillStyle = '#dbeaff';
  cx2.fillText(Math.round(G2.bluePct*100)+'%', barX+8, barY+barH-4);
  cx2.textAlign = 'right'; cx2.fillStyle = '#ffd7d7';
  cx2.fillText(Math.round(G2.redPct*100)+'%', barX+barW-8, barY+barH-4);
  cx2.textAlign = 'center'; cx2.fillStyle = '#93b2cf';
  cx2.font = '10px "Segoe UI",system-ui,sans-serif';
  cx2.fillText('CAPTURE '+Math.round(WIN_PCT*100)+'% TO WIN', W2/2, barY+barH+18);

  // stats
  cx2.textAlign = 'left';
  cx2.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
  cx2.fillStyle = '#7fa3c9'; cx2.fillText('KILLS', 22, 32);
  cx2.fillStyle = '#eaf4ff'; cx2.font = 'bold 20px "Segoe UI",system-ui,sans-serif';
  cx2.fillText(String(G2.kills), 22, 54);
  cx2.fillStyle = '#7fa3c9'; cx2.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
  cx2.fillText('SCORE', 22, 82);
  cx2.fillStyle = '#ffd76a'; cx2.font = 'bold 20px "Segoe UI",system-ui,sans-serif';
  cx2.fillText(String(G2.score), 22, 104);

  // health
  const p = G2.player;
  if(p){
    const hw = Math.min(300, W2*0.32), hh = 18;
    const hx = 22, hy = H2 - 148;
    cx2.fillStyle = 'rgba(6,12,20,0.78)';
    roundRect(cx2, hx-4, hy-4, hw+8, hh+8, 8); cx2.fill();
    cx2.fillStyle = '#131b26';
    roundRect(cx2, hx, hy, hw, hh, 5); cx2.fill();

    const pct = p.alive ? Math.max(0, p.hp/p.maxHp) : 0;
    const g = cx2.createLinearGradient(hx,0,hx+hw,0);
    if(pct>0.5){ g.addColorStop(0,'#22c55e'); g.addColorStop(1,'#4ade80'); }
    else if(pct>0.25){ g.addColorStop(0,'#f59e0b'); g.addColorStop(1,'#fbbf24'); }
    else { g.addColorStop(0,'#dc2626'); g.addColorStop(1,'#f87171'); }
    cx2.fillStyle = g;
    roundRect(cx2, hx, hy, Math.max(hw*pct, 6), hh, 5); cx2.fill();

    cx2.fillStyle = '#0a1420';
    cx2.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
    cx2.textAlign = 'left';
    cx2.fillText(Math.ceil(p.alive?p.hp:0)+' / '+p.maxHp, hx+9, hy+13);

    if(!p.alive){
      cx2.textAlign = 'center';
      cx2.fillStyle = '#ff8a8a';
      cx2.font = 'bold 26px "Segoe UI",system-ui,sans-serif';
      cx2.fillText('RESPAWNING IN '+Math.ceil(p.respawn), W2/2, H2/2 + 10);
    }
  }

  // minimap
  mmT -= 1/60;
  if(mmT <= 0){ mmT = 0.18; updateMinimap2(); }

  const mmX = W2 - MMW - 20, mmY = H2 - MMH - 20;
  cx2.fillStyle = 'rgba(6,12,20,0.82)';
  roundRect(cx2, mmX-5, mmY-5, MMW+10, MMH+10, 8); cx2.fill();
  cx2.globalAlpha = 0.9;
  cx2.drawImage(mmCanvas, mmX, mmY);
  cx2.globalAlpha = 1;

  const sxr = MMW/WORLD_W, syr = MMH/WORLD_H;
  for(const u of G2.units){
    if(!u.alive) continue;
    const x = mmX+u.x*sxr, y = mmY+u.y*syr;
    if(u.isPlayer){
      cx2.fillStyle = '#fff';
      cx2.beginPath(); cx2.arc(x,y,3.2,0,6.2832); cx2.fill();
      cx2.strokeStyle = '#3a9bff'; cx2.lineWidth = 2; cx2.stroke();
    } else {
      cx2.fillStyle = u.team===BLUE ? '#5cb6ff' : '#ff5a5a';
      cx2.beginPath(); cx2.arc(x,y,2.1,0,6.2832); cx2.fill();
    }
  }
  cx2.strokeStyle = 'rgba(255,255,255,0.30)';
  cx2.lineWidth = 1.5;
  cx2.strokeRect(mmX+(G2.cam.x-W2/2)*sxr, mmY+(G2.cam.y-H2/2)*syr, W2*sxr, H2*syr);

  cx2.strokeStyle = 'rgba(90,150,210,0.55)';
  cx2.lineWidth = 2;
  roundRect(cx2, mmX-5, mmY-5, MMW+10, MMH+10, 8); cx2.stroke();
}

function start2D(){
  resize2D();
  initTerritory();
  G2.time = 0; G2.kills = 0; G2.score = 0; G2.shake = 0;
  G2.units.length = 0; G2.bullets.length = 0; G2.particles.length = 0;

let T = null;

const HUD = {

const ENEMY_SPOTS = [
  [-118, 232], [-64, 244], [-14, 228], [34, 240], [82, 230],

];

function groundY(z){
  if(z <= 150) return 0;
  if(z >= 210) return 20;
  return ((z-150)/60)*20;
}

function build3D(){
  T = {};

  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  stage3d.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const SKY = 0xa9c6e0;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 150, 760);

  const camera = new THREE.PerspectiveCamera(74, window.innerWidth/window.innerHeight, 0.08, 2400);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  scene.add(new THREE.HemisphereLight(0xdceaff, 0x5e5546, 1.05));
  const sun = new THREE.DirectionalLight(0xfff0d8, 1.25);
  sun.position.set(-220, 280, -200);
  scene.add(sun);

  /* ---------- terrain ---------- */
  (function terrain(){
    const pos=[], nor=[], col=[];
    const cSand  = new THREE.Color(0xcabb8f);
    const cSlope = new THREE.Color(0x94966d);
    const cTop   = new THREE.Color(0x6d7c58);

    function quad(a,b,c,d,color){
      const p1 = new THREE.Vector3(...a), p2 = new THREE.Vector3(...b);
      const p3 = new THREE.Vector3(...c), p4 = new THREE.Vector3(...d);
      const n = new THREE.Vector3().subVectors(p2,p1)
        .cross(new THREE.Vector3().subVectors(p3,p1)).normalize();
      const tris = [p1,p2,p3, p1,p3,p4];
      for(const v of tris){
        pos.push(v.x,v.y,v.z);
        nor.push(n.x,n.y,n.z);
        col.push(color.r,color.g,color.b);
      }
    }

    // beach  z:0 → 150, y=0
    quad([-460,0,0],[-460,0,150],[460,0,150],[460,0,0], cSand);
    // slope  z:150 → 210, y:0 → 20
    quad([-460,0,150],[-460,20,210],[460,20,210],[460,0,150], cSlope);
    // plateau z:210 → 520, y=20
    quad([-460,20,210],[-460,20,520],[460,20,520],[460,20,210], cTop);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
    geo.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
    const mat = new THREE.MeshLambertMaterial({ vertexColors:true });
    scene.add(new THREE.Mesh(geo, mat));
  })();

  /* ---------- water ---------- */
  const wGeo = new THREE.PlaneGeometry(1500, 780, 48, 24);
  wGeo.rotateX(-Math.PI/2);
  const wPos = wGeo.attributes.position;
  const wBase = Float32Array.from(wPos.array);
  const water = new THREE.Mesh(wGeo, new THREE.MeshLambertMaterial({
    color: 0x2e6d8e, transparent:true, opacity:0.94
  }));
  water.position.set(0, -0.8, -380);
  scene.add(water);
  T.water = water; T.wPos = wPos; T.wBase = wBase;

  /* ---------- landing craft ---------- */
  const boat = new THREE.Group();
  const boatMat = new THREE.MeshLambertMaterial({ color:0x4d5647 });
  const boatDark = new THREE.MeshLambertMaterial({ color:0x363e33 });

  const floor = new THREE.Mesh(new THREE.BoxGeometry(7,0.5,14), boatDark);
  floor.position.set(0,0.25,0); boat.add(floor);

  const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.5,2.6,14), boatMat);
  wallL.position.set(-3.4,1.3,0); boat.add(wallL);
  const wallR = wallL.clone(); wallR.position.x = 3.4; boat.add(wallR);

  const stern = new THREE.Mesh(new THREE.BoxGeometry(7,2.6,0.5), boatMat);
  stern.position.set(0,1.3,7); boat.add(stern);

  const rampPivot = new THREE.Group();
  rampPivot.position.set(0,0.5,7);
  const ramp = new THREE.Mesh(new THREE.BoxGeometry(7,4,0.35), boatMat);
  ramp.position.set(0,2,0);
  rampPivot.add(ramp);
  boat.add(rampPivot);

  boat.position.set(0,0,-140);
  scene.add(boat);
  T.boat = boat; T.ramp = rampPivot;

  /* ---------- bunkers + hedgehogs ---------- */
  const bunkerMat = new THREE.MeshLambertMaterial({ color:0x8a8578 });
  for(let i=0;i<7;i++){
    const bx = -260 + i*88 + (Math.random()-0.5)*20;
    const b = new THREE.Mesh(new THREE.BoxGeometry(26, 11, 18), bunkerMat);
    b.position.set(bx, 20 + 5.5, 218 + Math.random()*14);
    scene.add(b);
    const slit = new THREE.Mesh(new THREE.BoxGeometry(18, 2.4, 1),
      new THREE.MeshBasicMaterial({ color:0x14181c }));
    slit.position.set(bx, 20 + 7.5, b.position.z - 9.2);
    scene.add(slit);
  }

  const steelMat = new THREE.MeshLambertMaterial({ color:0x3a4048 });
  for(let i=0;i<34;i++){
    const g = new THREE.Group();
    const a = new THREE.Mesh(new THREE.BoxGeometry(0.5,4.4,0.5), steelMat);
    a.rotation.z =  0.72;
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.5,4.4,0.5), steelMat);
    b.rotation.z = -0.72;
    g.add(a,b);
    g.position.set((Math.random()-0.5)*620, 1.6, 12 + Math.random()*128);
    g.rotation.y = Math.random()*3.14;
    scene.add(g);
  }

  /* ---------- player weapon (viewmodel) ---------- */
  const gun = new THREE.Group();
  const mDark  = new THREE.MeshLambertMaterial({ color:0x2b2f36 });
  const mWood  = new THREE.MeshLambertMaterial({ color:0x6b4a2f });
  const mSteel = new THREE.MeshLambertMaterial({ color:0x565c66 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.12,0.62), mDark);
  body.position.set(0,0,-0.1); gun.add(body);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,0.62,8), mSteel);
  barrel.rotation.x = Math.PI/2;
  barrel.position.set(0,0.01,-0.62); gun.add(barrel);
  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.11,0.28), mWood);
  stock.position.set(0,-0.03,0.32); gun.add(stock);
  const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.16,0.1), mSteel);
  mag.position.set(0,-0.13,0.02); gun.add(mag);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.16,0.08), mWood);
  grip.position.set(0,-0.12,0.2); grip.rotation.x = 0.3; gun.add(grip);

  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.11,6,6),
    new THREE.MeshBasicMaterial({ color:0xffdd88, transparent:true, opacity:0 }));
  flash.position.set(0,0.01,-0.95);
  gun.add(flash);

  gun.position.set(0.24,-0.2,-0.42);
  gun.rotation.y = -0.06;
  camera.add(gun);
  T.gun = gun; T.flash = flash;

  /* ---------- storage ---------- */
  T.renderer = renderer;
  T.scene = scene;
  T.camera = camera;
  T.enemies = [];
  T.tracers = [];
  T.fx = [];
  T.active = false;

  T.reset = () => reset3D();
  T.resize = () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  };
}

/* ---------- soldier enemy ---------- */
function makeSoldier(x, z){
  const g = new THREE.Group();
  const uniform = new THREE.MeshLambertMaterial({ color:0x4a5340 });
  const skin    = new THREE.MeshLambertMaterial({ color:0xc9a184 });
  const helmetM = new THREE.MeshLambertMaterial({ color:0x39412f });

  const legs = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.9,0.4), uniform);
  legs.position.y = 0.45; g.add(legs);

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.85,0.45), uniform);
  torso.position.y = 1.35; g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6), skin);
  head.position.y = 1.92; g.add(head);

  const helm = new THREE.Mesh(
    new THREE.SphereGeometry(0.27,8,6,0,Math.PI*2,0,Math.PI/2), helmetM);
  helm.position.y = 1.96; g.add(helm);

  const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.07,0.07,0.95),
    new THREE.MeshLambertMaterial({ color:0x25292b }));
  rifle.position.set(0.32, 1.35, 0.35); g.add(rifle);

  g.position.set(x, groundY(z), z);
  g.rotation.y = Math.PI + (Math.random()-0.5)*0.5;

  g.userData = { hp: 2, alive:true, fireCd: 1 + Math.random()*2.5, baseY: groundY(z) };
  return g;
}

/* ---------- fx helpers ---------- */
function tracer3D(from, to, color){
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:1 });
  const line = new THREE.Line(geo, mat);
  T.scene.add(line);
  T.tracers.push({ line, life: 0.11, max: 0.11 });
}

function boom3D(pos, scale, color){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, 10, 8),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.9 })
  );
  mesh.position.copy(pos);
  mesh.scale.setScalar(scale*0.3);
  T.scene.add(mesh);
  T.fx.push({ mesh, life:0.5, max:0.5, scale });
}

function sparks3D(pos, color){
  const n = 8;
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.09,0.09,0.09),
      new THREE.MeshBasicMaterial({ color, transparent:true })
    );
    m.position.copy(pos);
    T.scene.add(m);
    T.fx.push({
      mesh:m, life:0.3, max:0.3, scale:1,
      vel: new THREE.Vector3((Math.random()-0.5)*9, Math.random()*7, (Math.random()-0.5)*9)
    });
  }
}

function reset3D(){
  const S = T;
  S.time = 0;
  S.phase = 'boat';
  S.boatT = 0;
  S.hp = 100;
  S.alive = true;
  S.ammo = 8;
  S.reloading = false;
  S.reloadT = 0;
  S.fireCd = 0;
  S.yaw = Math.PI;
  S.pitch = -0.02;
  S.shake = 0;
  S.hurt = 0;
  S.recoil = 0;
  S.gunFlash = 0;
  S.kills = 0;
  S.wantFire = false;
  S.shellT = 2.0;
  S.playerPos = new THREE.Vector3(0, 1.7, 0);

  S.boat.position.set(0, 0, -140);
  S.boat.rotation.set(0,0,0);
  S.ramp.rotation.x = 0;

  // clear enemies
  for(const e of S.enemies) S.scene.remove(e);
  S.enemies = [];

  // clear fx
  for(const t of S.tracers) S.scene.remove(t.line);
  S.tracers = [];

  S.fx = [];

  S.camera.position.set(0, 2.0, -138);
  S.gun.visible = false;
  updateHUD3D();

  endEl.classList.add('hidden');
  S.active = true;
}

/* ---------- 3D input ---------- */
let dragLook = false, dragPointer = null;
let mouseLocked = false, lockFailed = false;
const cv3 = () => T ? T.renderer.domElement : null;

document.addEventListener('pointerlockchange', ()=>{
  const c = cv3();
  mouseLocked = !!c && document.pointerLockElement === c;
});
document.addEventListener('pointerlockerror', ()=>{ lockFailed = true; });

window.addEventListener('mousemove', e=>{
  if(mode !== '3d' || !T || !T.active) return;
  if(mouseLocked){
    T.yaw   -= e.movementX * 0.0022;
    T.pitch -= e.movementY * 0.0022;
    T.pitch = Math.max(-1.35, Math.min(1.35, T.pitch));
  }
});

window.addEventListener('keydown', e=>{
  if(mode === '3d' && e.code === 'Escape') exitToMenu();
});

function bind3DInput(){
  const c = cv3();
  if(!c || c.dataset.bound) return;
  c.dataset.bound = '1';

  c.addEventListener('click', ()=>{
    if(isTouch || mouseLocked || lockFailed) return;
    if(T && T.phase === 'combat'){
      const p = c.requestPointerLock && c.requestPointerLock();
      if(p && p.catch) p.catch(()=>{ lockFailed = true; });
    }
  });

  c.addEventListener('pointerdown', e=>{
    if(mode !== '3d' || !T || !T.active) return;
    initAudio();
    if(e.pointerType === 'mouse' && e.button !== 0) return;

    if(e.pointerType !== 'mouse'){ dragLook = true; dragPointer = e.pointerId; T.wantFire = true; }
    else {
      dragLook = !mouseLocked;
      dragPointer = e.pointerId;
      T.wantFire = true;
    }
    try { c.setPointerCapture(e.pointerId); } catch(_) {}
  });

  c.addEventListener('pointermove', e=>{
    if(mode !== '3d' || !T || !T.active) return;
    if(!dragLook || e.pointerId !== dragPointer) return;
    if(e.pointerType === 'mouse' && mouseLocked) return;
    T.yaw   -= e.movementX * 0.0035;
    T.pitch -= e.movementY * 0.0035;
    T.pitch = Math.max(-1.35, Math.min(1.35, T.pitch));
  });

  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
    c.addEventListener(ev, e=>{
      if(e.pointerId === dragPointer){ dragLook = false; dragPointer = null; }
      if(T) T.wantFire = false;
    });
  });
}

/* ---------- 3D shooting ---------- */
function playerShoot(){
  const S = T;
  if(S.reloading || S.ammo <= 0 || !S.alive) return;

  S.ammo--;
  S.fireCd = 0.11;
  S.gunFlash = 0.055;
  S.recoil = 1;
  S.shake = Math.min(S.shake + 0.55, 2.2);
  blip(220, 0.09, 'square', 0.055, 70);

  const origin = S.camera.position.clone();
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(S.camera.quaternion);

  let hit = null, bestT = Infinity;
  for(const e of S.enemies){
    if(!e.userData.alive) continue;
    const c = e.position.clone(); c.y += 1.3;
    const to = c.clone().sub(origin);
    const proj = to.dot(dir);
    if(proj < 0 || proj > 340) continue;
    const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
    if(closest.distanceTo(c) < 1.15 && proj < bestT){ bestT = proj; hit = e; }
  }

  const end = hit
    ? hit.position.clone().add(new THREE.Vector3(0,1.3,0))
    : origin.clone().add(dir.clone().multiplyScalar(340));

  const muzzle = origin.clone().add(dir.clone().multiplyScalar(1.0))
    .add(new THREE.Vector3(0.2,-0.12,0));
  tracer3D(muzzle, end, 0xffe08a);

  if(hit){
    hit.userData.hp--;
    sparks3D(end, 0xff6b4a);
    blip(620, 0.05, 'square', 0.03);
    HUD.hit.classList.add('show');
    setTimeout(()=> HUD.hit.classList.remove('show'), 90);

    if(hit.userData.hp <= 0){
      hit.userData.alive = false;
      boom3D(hit.position.clone().add(new THREE.Vector3(0,1.2,0)), 2.4, 0xff8a5a);
      S.scene.remove(hit);
      S.kills++;
      S.aliveCount--;
      blip(120, 0.3, 'sawtooth', 0.06, 40);
      updateHUD3D();
      if(S.aliveCount <= 0) win3D();
    }
  } else {
    sparks3D(end, 0xcfd6dd);
  }

  if(S.ammo <= 0) startReload();
  updateHUD3D();
}

function startReload(){
  const S = T;
  if(S.reloading) return;
  S.reloading = true;
  S.reloadT = 1.5;
  blip(300, 0.08, 'triangle', 0.03);
  updateHUD3D();
}

function hurtPlayer(dmg){
  const S = T;
  if(!S.alive) return;
  S.hp -= dmg;
  S.hurt = 1;
  S.shake = Math.min(S.shake + 2.4, 7);
  blip(90, 0.14, 'sawtooth', 0.045, 55);
  if(S.hp <= 0){ S.hp = 0; S.alive = false; lose3D(); }
  updateHUD3D();
}

function updateHUD3D(){
  const S = T; if(!S) return;
  HUD.hp.style.width = Math.max(0, (S.hp/100)*100) + '%';
  HUD.hp.style.background = S.hp > 55 ? 'linear-gradient(90deg,#22c55e,#4ade80)'
    : S.hp > 25 ? 'linear-gradient(90deg,#f59e0b,#fbbf24)'
    : 'linear-gradient(90deg,#dc2626,#f87171)';
  HUD.ammo.textContent = S.ammo;
  HUD.reload.classList.toggle('show', S.reloading);
  HUD.count.textContent = Math.max(0, S.aliveCount);
}

/* ---------- 3D end states ---------- */
function lose3D(){
  T.active = false;
  if(document.pointerLockElement) document.exitPointerLock();
  $('#endTitle').textContent = 'K.I.A.';
  $('#endTitle').className = '';
  $('#endSub').textContent = 'You fell on the beach. The bluff still holds.';
  $('#endBtn').textContent = 'REDEPLOY';
  endEl.classList.remove('hidden');
  HUD.vign.style.opacity = '0';
}

function win3D(){
  T.active = false;
  if(document.pointerLockElement) document.exitPointerLock();
  $('#endTitle').textContent = 'BEACH SECURED';
  $('#endTitle').className = 'win';
  $('#endSub').textContent = 'All ' + T.kills + ' defenders neutralised. The bluff is yours.';
  $('#endBtn').textContent = 'PLAY AGAIN';
  endEl.classList.remove('hidden');
  blip(523,0.14,'square',0.06);
  setTimeout(()=>blip(659,0.14,'square',0.06),120);
  setTimeout(()=>blip(784,0.3,'square',0.06),240);
}

$('#endBtn').addEventListener('click', ()=>{ if(T) reset3D(); });

/* ---------- 3D update ---------- */
function update3D(dt){
  const S = T;
  if(!S || !S.active) return;
  S.time += dt;
  S.shake *= Math.exp(-9*dt);

  /* ---- water ---- */
  const wp = S.wPos, wb = S.wBase;
  for(let i=0; i<wp.count; i++){
    const x = wb[i*3], z = wb[i*3+2];
    wp.setY(i, Math.sin(x*0.045 + S.time*1.7)*0.26 + Math.cos(z*0.06 + S.time*1.1)*0.2);
  }
  wp.needsUpdate = true;

  /* ---- tracers / fx ---- */
  for(let i=S.tracers.length-1; i>=0; i--){
    const t = S.tracers[i];
    t.life -= dt;
    t.line.material.opacity = Math.max(0, t.life/t.max);
    if(t.life <= 0){ S.scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); S.tracers.splice(i,1); }
  }
  for(let i=S.fx.length-1; i>=0; i--){
    const f = S.fx[i];
    f.life -= dt;
    const k = 1 - f.life/f.max;
    if(f.vel){
      f.mesh.position.addScaledVector(f.vel, dt);
      f.vel.y -= 22*dt;
      f.mesh.rotation.x += dt*9; f.mesh.rotation.y += dt*7;
      f.mesh.material.opacity = Math.max(0, 1-k);
    } else {
      f.mesh.scale.setScalar(f.scale*(0.35 + k*1.5));
      f.mesh.material.opacity = Math.max(0, 1-k);
    }
    if(f.life <= 0){ S.scene.remove(f.mesh); f.mesh.geometry.dispose(); f.mesh.material.dispose(); S.fx.splice(i,1); }
  }

  /* ---- gun flash ---- */
  if(S.gunFlash > 0){
    S.gunFlash -= dt;
    S.flash.material.opacity = Math.max(0, S.gunFlash/0.055);
    S.flash.scale.setScalar(0.8 + Math.random()*0.6);
  } else {
    S.flash.material.opacity = 0;
  }
  if(S.recoil > 0) S.recoil = Math.max(0, S.recoil - dt*7);
  S.gun.position.z = -0.42 + S.recoil*0.09;
  S.gun.position.x = 0.24 + Math.sin(S.time*2)*0.004;

  /* ============ BOAT PHASE ============ */
  if(S.phase === 'boat'){
    S.boatT += dt;
    const dur = 7.0;
    const k = Math.min(1, S.boatT/dur);
    const e = 1 - Math.pow(1-k, 3);

    S.boat.position.z = -140 + e*126;
    S.boat.position.y = Math.sin(S.time*1.6)*0.14;
    S.boat.rotation.z = Math.sin(S.time*1.1)*0.022;
    S.boat.rotation.x = Math.sin(S.time*0.9)*0.012;

    if(S.boatT > 5.0){
      const rk = Math.min(1, (S.boatT-5.0)/1.3);
      S.ramp.rotation.x = rk * Math.PI * 0.5;
    }

    // shells hitting the water
    S.shellT -= dt;
    if(S.shellT <= 0){
      S.shellT = 0.9 + Math.random()*1.6;
      const p = new THREE.Vector3(
        (Math.random()-0.5)*90,
        -0.6,
        S.boat.position.z + 10 + Math.random()*40
      );
      boom3D(p, 6 + Math.random()*5, 0xdfe9f2);
      blip(70, 0.25, 'sawtooth', 0.05, 30);
      S.shake = Math.min(S.shake + 4, 9);
    }

    // camera inside boat
    const bob = Math.sin(S.time*2.6)*0.045;
    S.camera.position.set(S.boat.position.x, 2.05 + S.boat.position.y + bob, S.boat.position.z + 1.5);
    S.yaw = Math.PI + Math.sin(S.time*0.55)*0.05;
    S.pitch = -0.03 + Math.sin(S.time*0.8)*0.015;

    if(S.boatT > 6.9){
      S.phase = 'combat';
      S.playerPos.set(S.boat.position.x, 0, S.boat.position.z + 8);
      S.gun.visible = true;
      S.yaw = Math.PI;
      S.pitch = -0.03;
    }
  }
  /* ============ COMBAT PHASE ============ */
  else if(S.phase === 'combat'){
    if(S.alive){
      // ---- movement ----
      let fwd = 0, str = 0;
      if(joy.active){ fwd = -joy.y; str = joy.x; }
      else {
        if(keys.KeyW || keys.ArrowUp)    fwd += 1;
        if(keys.KeyS || keys.ArrowDown)  fwd -= 1;
        if(keys.KeyD || keys.ArrowRight) str += 1;
        if(keys.KeyA || keys.ArrowLeft)  str -= 1;
      }
      const l = Math.hypot(fwd, str);
      if(l > 1){ fwd /= l; str /= l; }

      const SPEED = 7.2;
      const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw);
      const rx =  Math.cos(S.yaw), rz = -Math.sin(S.yaw);

      S.playerPos.x += (fx*fwd + rx*str) * SPEED * dt;
      S.playerPos.z += (fz*fwd + rz*str) * SPEED * dt;

      S.playerPos.x = Math.max(-420, Math.min(420, S.playerPos.x));
      S.playerPos.z = Math.max(-45,  Math.min(340, S.playerPos.z));

      const gy = groundY(S.playerPos.z);
      const bob = (l > 0.1) ? Math.sin(S.time*11)*0.035 : 0;
      S.playerPos.y = gy + 1.68 + bob;

      S.camera.position.copy(S.playerPos);

      // ---- weapon handling ----
      S.fireCd -= dt;
      const trigger = S.wantFire || mouseLockedDown || fire.held ||
                      (!isTouch && (mouseDownNoLock)) || keys.Space;
      if(trigger && S.fireCd <= 0){
        if(S.reloading){ /* blocked */ }
        else if(S.ammo > 0) playerShoot();
        else startReload();
      }

      if(S.reloading){
        S.reloadT -= dt;
        if(S.reloadT <= 0){
          S.reloading = false;
          S.ammo = 8;
          updateHUD3D();
        }
      }
    } else {
      // dead — camera sinks
      S.playerPos.y = Math.max(0.55, S.playerPos.y - dt*2.2);
      S.camera.position.copy(S.playerPos);
      S.pitch = Math.max(-1.2, S.pitch - dt*0.9);
    }
  }

  /* ---- camera orientation + shake ---- */
  S.camera.rotation.y = S.yaw;
  S.camera.rotation.x = S.pitch;
  S.camera.rotation.z = 0;
  if(S.shake > 0.01){
    S.camera.position.x += (Math.random()-0.5)*S.shake*0.045;
    S.camera.position.y += (Math.random()-0.5)*S.shake*0.045;
    S.camera.rotation.z += (Math.random()-0.5)*S.shake*0.004;
  }

  /* ---- enemy AI ---- */
  if(S.phase === 'combat' && S.alive){
    for(const e of S.enemies){
      if(!e.userData.alive) continue;
      const d = e.position.distanceTo(S.playerPos);
      e.lookAt(S.playerPos.x, e.position.y, S.playerPos.z);
      e.rotation.x = 0;

      if(d > 320) continue;

      e.userData.fireCd -= dt;
      if(e.userData.fireCd <= 0){
        e.userData.fireCd = 1.3 + Math.random()*2.4;

        const from = e.position.clone().add(new THREE.Vector3(0, 1.55, 0));
        const to = S.playerPos.clone().add(new THREE.Vector3(
          (Math.random()-0.5)*3.2, (Math.random()-0.5)*1.4, (Math.random()-0.5)*3.2
        ));
        tracer3D(from, to, 0xffb347);
        blip(150, 0.05, 'square', 0.018);

        const chance = 0.36 * (1 - d/420);
        if(Math.random() < chance) hurtPlayer(6 + Math.random()*7);
      }
    }
  }

  /* ---- hurt vignette ---- */
  if(S.hurt > 0){
    S.hurt = Math.max(0, S.hurt - dt*2.2);
    HUD.vign.style.opacity = String(S.hurt*0.9);
  }

  /* ---- atmosphere: distant shelling on the bluff ---- */
  if(S.phase === 'combat'){
    S.shellT -= dt;
    if(S.shellT <= 0){
      S.shellT = 4 + Math.random()*6;
      const p = new THREE.Vector3((Math.random()-0.5)*500, 22, 230 + Math.random()*90);
      boom3D(p, 7, 0xffb066);
      blip(60, 0.35, 'sawtooth', 0.035, 25);
    }
  }
}

let mouseLockedDown = false;
let mouseDownNoLock = false;
window.addEventListener('mousedown', e=>{
  if(mode !== '3d' || !T) return;
  if(e.button === 0){
    if(mouseLocked) mouseLockedDown = true;
    else mouseDownNoLock = true;
  }
});
window.addEventListener('mouseup', e=>{
  if(e.button === 0){ mouseLockedDown = false; mouseDownNoLock = false; }
});

function render3D(){
  if(T && T.renderer) T.renderer.render(T.scene, T.camera);
}

function start3D(){
  stage3d.classList.remove('hidden');
  hud3d.classList.remove('hidden');

  if(!T) build3D();
  bind3DInput();
  T.resize();
  reset3D();

  mouseLockedDown = false;
  mouseDownNoLock = false;
  dragLook = false;
  dragPointer = null;

  last = performance.now();
}

/* ══════════════════════════════════════════════════════════
   MASTER LOOP
   ══════════════════════════════════════════════════════════ */
let last = performance.now();

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  if(mode === '2d'){
    update2D(dt);
    render2D();
  } else if(mode === '3d'){
    update3D(dt);
    render3D();
  }

  requestAnimationFrame(loop);
}

/* ---------- resize ---------- */
window.addEventListener('resize', ()=>{
  if(mode === '2d') resize2D();
  if(T && T.resize) T.resize();
});

/* ---------- boot ---------- */
if(T === null){ /* three.js may not be needed until mode 3d */ }
requestAnimationFrame(loop);

})();
</script>
